[project]
name = "safeassist-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishan", email = "krishkydv77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.1,<3.0",
    "fastapi>=0.115,<1.0",
    "google-genai>=1.0,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyjwt>=2.8,<3.0",
    "pymysql>=1.1,<2.0",
    "pytest>=8.0,<9.0",
    "requests>=2.32,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.38,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
safeassist-ai = "safeassist_ai:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
