services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./safeassist.db
    volumes:
      - safeassist_data:/app
  dashboard:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      SAFEASSIST_API_URL: http://api:8000/api/v1
    depends_on:
      - api
volumes:
  safeassist_data:
